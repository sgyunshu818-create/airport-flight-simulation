<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle}">停机位表单</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/header :: topbar}"></header>
<main class="container narrow">
    <section class="page-title"><h1 th:text="${formTitle}">停机位表单</h1></section>
    <div class="alert" th:if="${error}" th:text="${error}">error</div>
    <form class="form-grid panel" method="post" th:object="${gate}" th:action="${gate.id == null} ? @{/gates} : @{/gates/{id}(id=${gate.id})}">
        <label>停机位编号<input type="text" th:field="*{gateNo}" required></label>
        <label>状态
            <select th:field="*{status}">
                <option th:each="item : ${statuses}" th:value="${item}" th:text="${item}"></option>
            </select>
        </label>
        <label>适配机型
            <select th:field="*{aircraftType}" required>
                <option value="">请选择</option>
                <option th:each="item : ${aircraftTypes}" th:value="${item}" th:text="${item}"></option>
            </select>
        </label>
        <div class="form-actions">
            <button class="button primary" type="submit">保存</button>
            <a class="button" th:href="@{/gates}">返回</a>
        </div>
    </form>
</main>
</body>
</html>
