<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色权限视图</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/header :: topbar}"></header>
<main class="container">
    <section class="page-title">
        <div>
            <h1>角色权限视图</h1>
        </div>
    </section>

    <section class="panel">
        <div class="panel-header"><h2>角色工作台</h2><span class="status">RBAC</span></div>
        <div class="table-wrap">
            <table class="data-table">
                <thead><tr><th>角色</th><th>可见模块</th><th>权限范围</th></tr></thead>
                <tbody>
                <tr th:each="item : ${roles}">
                    <td><span class="status status-ok" th:text="${item.roleName}">管理员</span></td>
                    <td th:text="${item.visibleModules}">全部模块</td>
                    <td th:text="${item.permissionScope}">完整权限</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
